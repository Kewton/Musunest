entities:
  - name: member
    fields:
      name:
        type: string
        label: 名前
  - name: item
    fields:
      name:
        type: string
        label: 名前
      kind:
        type: enum
        label: 種類
        options:
          food: 料理
          drink: 飲み物
          tool: 道具
      broughtBy:
        type: ref
        to: member
        label: 持ってくる人
      quantity:
        type: number
        label: 数
      status:
        type: enum
        label: 準備の状態
        options:
          notYet: まだ
          ready: 用意できた
        default: notYet
views:
  - name: memberList
    type: table
    entity: member
    show: [name, assignedItemCount]
  - name: itemBoard
    type: board
    entity: item
    columns: status
  - name: itemList
    type: list
    entity: item
    show: [name, kind, broughtBy, quantity, status]
    filters: [kind, broughtBy]
actions:
  - name: addMember
    entity: member
    kind: create
  - name: addItem
    entity: item
    kind: create
  - name: markItemReady
    entity: item
    kind: update
    set:
      status: ready
    when: 'status == "notYet"'
validations:
  - name: quantityAtLeastOne
    entity: item
    expression: quantity >= 1
computed:
  - name: assignedItemCount
    entity: member
    type: number
    aggregate:
      count: item
      where:
        broughtBy: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
