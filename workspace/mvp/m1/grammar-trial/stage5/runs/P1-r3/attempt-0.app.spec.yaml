entities:
  - name: member
    fields:
      name:
        type: string
        label: 名前
  - name: item
    fields:
      name:
        type: string
        label: 名前
      kind:
        type: enum
        label: 種類
        options:
          dish: 料理
          drink: 飲み物
          tool: 道具
      broughtBy:
        type: ref
        to: member
        label: 持ってくる人
      quantity:
        type: number
        label: 数
      status:
        type: enum
        label: 準備の状態
        options:
          pending: まだ
          ready: 用意できた
        default: pending
views:
  - name: memberList
    type: table
    entity: member
    show: [name, itemCount]
  - name: itemBoard
    type: board
    entity: item
    columns: status
  - name: itemList
    type: list
    entity: item
    show: [name, kind, broughtBy, quantity, status]
    filters: [kind, broughtBy]
actions:
  - name: addMember
    entity: member
  - name: addItem
    entity: item
  - name: markReady
    entity: item
    kind: update
    set:
      status: ready
    when: 'status == "pending"'
validations:
  - name: quantityAtLeastOne
    entity: item
    expression: quantity >= 1
    message: 数は1以上にしてください
computed:
  - name: itemCount
    entity: member
    type: number
    label: 担当している持ち物の数
    aggregate:
      count: item
      where:
        broughtBy: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
