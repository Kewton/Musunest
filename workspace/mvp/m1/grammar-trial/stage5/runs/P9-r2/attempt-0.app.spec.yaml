entities:
  - name: member
    fields:
      name:
        type: string
        label: メンバー名
  - name: equipment
    fields:
      name:
        type: string
        label: 備品名
  - name: loan
    fields:
      equipment:
        type: ref
        to: equipment
        label: 備品
      borrower:
        type: ref
        to: member
        label: 借りた人
      dueDate:
        type: date
        label: 返す日
      status:
        type: enum
        options:
          loaned: 貸出中
          returned: 返却済み
        default: loaned
        label: 状態
views:
  - name: members
    type: table
    entity: member
    show: [name, loanCount]
  - name: equipmentList
    type: table
    entity: equipment
    show: [name, loanCount]
  - name: loans
    type: board
    entity: loan
    columns: status
    highlight: overdue
  - name: loanList
    type: table
    entity: loan
actions:
  - name: addMember
    entity: member
  - name: addEquipment
    entity: equipment
  - name: addLoan
    entity: loan
  - name: markReturned
    entity: loan
    kind: update
    set:
      status: returned
    when: 'status == "loaned"'
validations: []
computed:
  - name: loanCount
    entity: member
    type: number
    label: 借りた回数
    aggregate:
      count: loan
      where:
        borrower: this
  - name: equipmentLoanCount
    entity: equipment
    type: number
    label: 貸した回数
    aggregate:
      count: loan
      where:
        equipment: this
  - name: overdue
    entity: loan
    type: boolean
    expression: dueDate < today()
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
