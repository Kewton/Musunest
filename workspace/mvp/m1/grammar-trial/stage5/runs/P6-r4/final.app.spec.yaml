entities:
  - name: member
    fields:
      name:
        type: string
        label: メンバー名
  - name: payment
    fields:
      member:
        type: ref
        to: member
        label: メンバー
      amount:
        type: number
        label: 金額
      paidOn:
        type: date
        label: 支払日
      method:
        type: enum
        label: 払い方
        options:
          cash: 現金
          bankTransfer: 振込
          paymentApp: 送金アプリ
views:
  - name: dashboard
    type: dashboard
    widgets:
      - type: number
        value: thisMonthAmount
        label: 今月の集金額
        unit: 円
      - type: number
        value: thisMonthCount
        label: 今月の集金件数
        unit: 件
      - type: bar
        value: monthlyAmounts
        label: ここ半年の月ごとの集金
        unit: 円
      - type: pie
        value: paymentsByMethod
        label: 払い方の割合
  - name: memberList
    type: table
    entity: member
    show: [name, totalPaid]
  - name: paymentList
    type: list
    entity: payment
    show: [member, amount, paidOn, method]
    filters: [member, method]
actions:
  - name: addMember
    entity: member
    kind: create
  - name: addPayment
    entity: payment
    kind: create
  - name: editPayment
    entity: payment
    kind: update
  - name: deletePayment
    entity: payment
    kind: delete
validations:
  - name: positiveAmount
    entity: payment
    expression: amount > 0
    message: 金額は0円より大きくしてください
computed:
  - name: totalPaid
    entity: member
    type: number
    label: 支払合計
    aggregate:
      sum: payment.amount
      where:
        member: this
  - name: thisMonthAmount
    scope: app
    type: number
    label: 今月の集金額
    aggregate:
      sum: payment.amount
      where:
        paidOn:
          within: this_month
  - name: thisMonthCount
    scope: app
    type: number
    label: 今月の集金件数
    aggregate:
      count: payment
      where:
        paidOn:
          within: this_month
  - name: monthlyAmounts
    type: groups
    label: ここ半年の月ごとの集金
    aggregate:
      sum: payment.amount
      groupBy:
        month: payment.paidOn
      last: 6
  - name: paymentsByMethod
    type: groups
    label: 払い方の割合
    aggregate:
      count: payment
      groupBy: payment.method
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
