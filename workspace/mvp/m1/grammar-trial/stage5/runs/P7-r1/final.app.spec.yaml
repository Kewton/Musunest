entities:
  - name: member
    fields:
      name: string
  - name: match
    fields:
      date: date
      venue: string
      capacity: number
      participants:
        type: list
        of: member
views:
  - name: memberList
    type: table
    entity: member
    show: [name, matchCount]
  - name: matchList
    type: table
    entity: match
    show: [date, venue, capacity, participants, participantCount, remainingSlots]
actions:
  - name: addMember
    entity: member
  - name: addMatch
    entity: match
validations:
  - name: positiveCapacity
    entity: match
    expression: capacity >= 1
  - name: withinCapacity
    entity: match
    expression: len(participants) <= capacity
computed:
  - name: participantCount
    entity: match
    type: number
    expression: len(participants)
  - name: remainingSlots
    entity: match
    type: number
    expression: capacity - participantCount
  - name: matchCount
    entity: member
    type: number
    aggregate:
      count: match
      where:
        participants:
          contains: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
