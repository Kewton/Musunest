entities:
  - name: member
    fields:
      name:
        type: string
        label: メンバー名
  - name: equipment
    fields:
      name:
        type: string
        label: 備品名
      loanCount:
        type: number
        label: 貸出回数
  - name: loan
    fields:
      equipment:
        type: ref
        to: equipment
        label: 備品
      borrower:
        type: ref
        to: member
        label: 借りた人
      dueDate:
        type: date
        label: 返す日
      status:
        type: enum
        label: 状態
        options:
          borrowed: 貸出中
          returned: 返却済み
        default: borrowed
      overdue:
        type: string
views:
  - name: members
    type: table
    entity: member
    show: [name, borrowCount]
  - name: equipmentList
    type: table
    entity: equipment
    show: [name, loanCount]
  - name: loanBoard
    type: board
    entity: loan
    columns: status
    highlight: overdue
    actions: []
actions:
  - name: addMember
    entity: member
  - name: addEquipment
    entity: equipment
  - name: addLoan
    entity: loan
  - name: markReturned
    entity: loan
    kind: update
    set:
      status: returned
    when: status == "borrowed"
validations: []
computed:
  - name: loanCount
    entity: equipment
    type: number
    label: 貸出回数
    aggregate:
      count: loan
      where:
        equipment: this
  - name: borrowCount
    entity: member
    type: number
    label: 借入回数
    aggregate:
      count: loan
      where:
        borrower: this
  - name: overdue
    entity: loan
    type: boolean
    expression: dueDate < today()
    label: 期限超過
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
