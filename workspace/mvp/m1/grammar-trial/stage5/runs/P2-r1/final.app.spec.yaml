entities:
  - name: member
    fields:
      name:
        type: string
        label: メンバー名
  - name: item
    fields:
      itemName:
        type: string
        label: 持ち物
      category:
        type: enum
        label: 種類
        options:
          dish: 料理
          drink: 飲み物
          equipment: 道具
      assignedTo:
        type: ref
        to: member
        label: 担当
      quantity:
        type: number
        label: 個数
      status:
        type: enum
        label: 状態
        options:
          todo: まだ
          ready: 用意できた
        default: todo
views:
  - name: memberList
    type: table
    entity: member
    show: [name, totalQuantity]
  - name: itemBoard
    type: board
    entity: item
    columns: status
  - name: itemList
    type: list
    entity: item
    show: [itemName, category, assignedTo, quantity, status]
    filters: [category, assignedTo]
actions:
  - name: addMember
    entity: member
  - name: addItem
    entity: item
  - name: markPrepared
    entity: item
    kind: update
    set:
      status: ready
    when: status == "todo"
validations:
  - name: quantityAtLeastOne
    entity: item
    expression: quantity >= 1
    message: 個数は1以上にしてください
computed:
  - name: totalQuantity
    entity: member
    type: number
    aggregate:
      sum: item.quantity
      where:
        assignedTo: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
