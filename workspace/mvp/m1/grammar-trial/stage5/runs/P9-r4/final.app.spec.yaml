entities:
  - name: member
    fields:
      name:
        type: string
        label: メンバー名
  - name: equipment
    fields:
      name:
        type: string
        label: 備品名
  - name: loan
    fields:
      equipment:
        type: ref
        to: equipment
        label: 備品
      borrower:
        type: ref
        to: member
        label: 借りた人
      returnDate:
        type: date
        label: 返す日
      status:
        type: enum
        label: 状態
        options:
          lending: 貸出中
          returned: 返却済み
        default: lending
views:
  - name: memberList
    type: table
    entity: member
    show: [name, borrowedCount]
  - name: equipmentList
    type: table
    entity: equipment
    show: [name, loanCount]
  - name: loanBoard
    type: board
    entity: loan
    columns: status
    highlight: overdue
    
actions:
  - name: createMember
    entity: member
  - name: createEquipment
    entity: equipment
  - name: createLoan
    entity: loan
  - name: markReturned
    entity: loan
    kind: update
    set:
      status: returned
    when: 'status == "lending"'
validations: []
computed:
  - name: overdue
    entity: loan
    type: boolean
    label: 返す日超過
    expression: returnDate < today()
  - name: loanCount
    entity: equipment
    type: number
    label: 貸した回数
    aggregate:
      count: loan
      where:
        equipment: this
  - name: borrowedCount
    entity: member
    type: number
    label: 借りた回数
    aggregate:
      count: loan
      where:
        borrower: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
