entities:
  - name: member
    fields:
      name: string
  - name: item
    fields:
      name: string
      kind:
        type: enum
        options:
          dish: 料理
          drink: 飲み物
          tool: 道具
      broughtBy:
        type: ref
        to: member
      quantity: number
      status:
        type: enum
        options:
          notReady: まだ
          ready: 用意できた
        default: notReady
views:
  - name: memberList
    type: table
    entity: member
    show: [name, assignedItemCount]
  - name: itemBoard
    type: board
    entity: item
    columns: status
  - name: itemList
    type: list
    entity: item
    show: [name, kind, broughtBy, quantity, status]
    filters: [kind, broughtBy]
actions:
  - name: addMember
    entity: member
  - name: addItem
    entity: item
  - name: markReady
    entity: item
    kind: update
    set:
      status: ready
    when: 'status == "notReady"'
validations:
  - name: quantityAtLeastOne
    entity: item
    expression: quantity >= 1
computed:
  - name: assignedItemCount
    entity: member
    type: number
    aggregate:
      count: item
      where:
        broughtBy: this
permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity
minIdentity:
  mode: anonymous
