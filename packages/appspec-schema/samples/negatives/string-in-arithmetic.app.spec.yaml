# 負例：文字列の項目 payer を掛け算に使っている。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed:
  - name: doubled
    entity: expense
    expression: payer * 2
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
