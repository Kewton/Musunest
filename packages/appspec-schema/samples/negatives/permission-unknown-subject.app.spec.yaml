# 負例：権限 write の subject owner は M1.1 の subject（minIdentity）に無い。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: owner

minIdentity:
  mode: anonymous
