# 負例：計算 isPositive の type は number なのに、式が真偽になる。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed:
  - name: isPositive
    entity: expense
    expression: amount > 0
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
