# 負例：expense の計算が、別の entity budget の項目を参照している（M1.1 は同じ entity の中だけ）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list
  - name: budget
    fields:
      limit: number

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed:
  - name: overBudget
    entity: expense
    expression: amount - budget.limit
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
