# 負例：選択肢の項目 status の options が空である（キーを 1 つも書いていない）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: task
    fields:
      title: string
      status:
        type: enum
        options:
        default: todo

views:
  - name: taskList
    entity: task

actions:
  - name: addTask
    entity: task

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
