# 負例：entity の中で、同じ欄 `name` を 2 回書いている。
# 写像の同じキーは重複させない——2 回目を `SHAPE_KEY_DUPLICATE` で断る。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
