# 負例：決まった値への書き換え（set）の項目 ammount が、その操作の entity expense に無い。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense
  - name: fixExpense
    entity: expense
    kind: update
    set:
      ammount: 1

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
