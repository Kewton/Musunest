# 負例：期間の条件（`within`）が、`date` でない項目 `amount` を指している。
# 期間で絞れるのは日付（`date`）の項目だけである（M1.4。Issue #178）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: member
    fields:
      name: string
  - name: expense
    fields:
      paidOn: date
      amount: number
      payer:
        type: ref
        to: member

views:
  - name: memberList
    entity: member

actions:
  - name: addMember
    entity: member

validations: []

computed:
  - name: thisMonthTotal
    scope: app
    aggregate:
      sum: expense.amount
      where:
        amount:
          within: this_month
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
