# 負例：集計の対象（sum）が数ではなく、書いた項目 description は文字列である。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: member
    fields:
      name: string
  - name: expense
    fields:
      description: string
      amount: number
      payer:
        type: ref
        to: member

views:
  - name: memberList
    entity: member

actions:
  - name: addMember
    entity: member

validations: []

computed:
  - name: described
    entity: member
    aggregate:
      sum: expense.description
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
