# 負例：検査の文言（message）が文字列ではなく、並びになっている。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations:
  - name: positiveAmount
    entity: expense
    expression: amount > 0
    message: [金額は 1 円以上にしてください]

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
