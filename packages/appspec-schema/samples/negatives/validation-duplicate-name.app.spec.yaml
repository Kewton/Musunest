# 負例：検査の名前 positiveAmount が 2 つある。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations:
  - name: positiveAmount
    entity: expense
    expression: amount > 0
  - name: positiveAmount
    entity: expense
    expression: amount > 1

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
