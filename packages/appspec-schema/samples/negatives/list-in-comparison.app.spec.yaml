# 負例：list の項目 participants を数と比べている。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations:
  - name: someoneShares
    entity: expense
    expression: participants > 0

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
