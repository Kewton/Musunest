# 負例：精算の額が数でない（`LOGIC_SETTLE_AMOUNT_NOT_NUMBER`）
#
# 見本 warikan の 1 か所だけをわざと間違えたものである。精算（`settle`）の `amount` は
# **支出の額の項目**（数）を指さなければならないが、ここでは文字列の項目 `description` を指している。
# 宣言の 7 欄と、ほかの計算・検査は見本のままである。

entities:
  - name: member
    fields:
      name: string

  - name: expense
    fields:
      description: string
      amount: number
      payer:
        type: ref
        to: member
      participants:
        type: list
        of: member

views:
  - name: memberList
    entity: member
  - name: expenseList
    entity: expense

actions:
  - name: addMember
    entity: member
  - name: addExpense
    entity: expense

validations:
  - name: positiveAmount
    entity: expense
    expression: amount > 0
    message: 金額は 1 円以上にしてください
  - name: someoneShares
    entity: expense
    expression: len(participants) > 0
    message: 割る人を 1 人以上選んでください

computed:
  - name: headcount
    entity: expense
    expression: len(participants)
    type: number
  - name: shareAmount
    entity: expense
    expression: amount / max(1, headcount)
    type: number
  - name: paid
    entity: member
    aggregate:
      sum: expense.amount
      where:
        payer: this
    type: number
  - name: owed
    entity: member
    aggregate:
      sum: expense.shareAmount
      where:
        participants:
          contains: this
    type: number
  - name: balance
    entity: member
    expression: paid - owed
    type: number
  - name: settlement
    entity: member
    settle:
      expense: expense
      amount: description
      payer: payer
      shares: participants

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
