# 負例：一覧に type を書いている（画面の種類は M1.2 以降の語彙で、M1.1 には無い）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense
    type: table

actions:
  - name: addExpense
    entity: expense

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
