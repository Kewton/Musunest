# 負例：ボード（type: board）の columns が、選択肢（enum）の項目ではなく数の項目 estimate を指している。
# columns は、その entity の enum の項目を指さなければならない（列の並びは options に書いた順である。M1.3）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: task
    fields:
      title: string
      estimate: number
      status:
        type: enum
        options:
          todo: 未着手
          doing: 進行中
          done: 完了
        default: todo

views:
  - name: taskBoard
    entity: task
    type: board
    columns: estimate

actions:
  - name: addTask
    entity: task

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
