# 負例：欄 `views` が並びではない（中身が無ければ `[]` と書く）。
# `SHAPE_VALUE_INVALID` で断る。期待する誤りコードは index.json。
# ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views: expenseList

actions:
  - name: addExpense
    entity: expense

validations: []

computed: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
