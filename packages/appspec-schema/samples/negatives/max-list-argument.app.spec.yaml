# 負例：max に list の項目 participants を渡している（max は数を 2 つ）。
# 期待する誤りコードは index.json。ほかの箇所は正しい宣言にしてある。

entities:
  - name: expense
    fields:
      amount: number
      payer: string
      participants: list

views:
  - name: expenseList
    entity: expense

actions:
  - name: addExpense
    entity: expense

validations: []

computed:
  - name: largest
    entity: expense
    expression: max(participants, 1)
    type: number

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
