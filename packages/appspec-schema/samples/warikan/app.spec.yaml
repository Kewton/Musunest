# 見本「旅行の割り勘」（M1.2。community.app-spec/v0.2-draft）
#
# M1.1 の見本「支出の記録」に、参照（`ref`）と参照の並び（`list of`）を足したものである。
# 払った人（`payer`）は member のレコード 1 件を、割る人（`participants`）は member の並びを指す。
# **値は member のレコード ID である**（同じ名前のメンバーが 2 人いても ID で区別できる）。
#
# デモ：メンバー A・B・C を登録し、夕食 6000 円（A が払う）とタクシー 3000 円（B が払う）を入れると、
# 一覧に 1 人あたり 2000 円と 1000 円が出て、メンバーの一覧に払った額（`paid`）・負担する額（`owed`）・
# 差し引き（`balance`）が出る。精算の一覧には **「C さん → A さん 3,000 円」の 1 件**が出る
# （C の差し引きが −3000、A が +3000 である）。
#
# 直す・消す（M1.2。Issue #109）：
# 夕食を 6000→3000 に直すと A/B が `3000/2000/1000`、C が `0/2000/-2000` になり、精算は C→A 1000・C→B 1000。
# 続けてタクシーを消すと A が `3000/1000/2000`、B/C が `0/1000/-1000` になり、精算は B→A 1000・C→A 1000。
# **参照されているメンバーは消せない**（payer に使われていても、participants にだけ使われていても断る）。
#
# 採点のシナリオは同じディレクトリの scenario.json、
# 意味は ../../docs/semantics.md（「ref」「list」「message」「aggregate」「sum」「count」「table」「settlement」
# 「action」「create」「update」「delete」）にある。

entities:
  - name: member
    fields:
      name: string          # 名前（画面に出すのはこの項目である）

  - name: expense
    fields:
      description: string   # 内容
      amount: number        # 金額（円）
      payer:                # 払った人（member のレコード 1 件を ID で指す）
        type: ref
        to: member
      participants:         # 割る人（member のレコードの並びを ID で指す）
        type: list
        of: member

views:
  # 表（M1.2）。`show` を書かなければ、項目（宣言の順）に続いて計算（宣言の順）である——
  # この一覧は name・paid・owed・balance の順に出る
  - name: memberList
    entity: member
    type: table
  # `show` を書くと、**その順**で列が出る（計算の shareAmount を、項目の間にも置ける）
  - name: expenseList
    entity: expense
    type: table
    show: [description, shareAmount, amount, payer]
  # 精算の表示（M1.2）。API が返した送金の並び（member のレコードの ID）を、名前に対応づけて見せる。
  # **画面は計算しない**——`settle` の結果をそのまま出す（03 §2.3）
  - name: settlement
    entity: member
    type: settlement

actions:
  # 操作の種類（`kind`。M1.2）。**省略すると create** である（M1.1 の宣言の意味を変えない）
  - name: addMember
    entity: member
  # 明示の create（省略と同じ意味である。docs/semantics.md「create」）
  - name: addExpense
    entity: expense
    kind: create
  # 直す（全項目の置換）。対象のレコードの ID を取る（docs/semantics.md「update」）
  - name: editExpense
    entity: expense
    kind: update
  # 消す。参照されている行は消せない（docs/semantics.md「delete」）
  - name: deleteExpense
    entity: expense
    kind: delete
  # メンバーを消す。payer に使われている・participants にだけ使われている、のどちらでも断られる
  - name: deleteMember
    entity: member
    kind: delete

validations:
  - name: positiveAmount
    entity: expense
    expression: amount > 0
    message: 金額は 1 円以上にしてください
  - name: someoneShares
    entity: expense
    expression: len(participants) > 0
    message: 割る人を 1 人以上選んでください

computed:
  # 割る人数。参照の並びでも `len` は使える（`list` と同じ扱いである）
  - name: headcount
    entity: expense
    expression: len(participants)
    type: number
  # 1 人あたりの額。max は 0 で割らないための守り（参照の並びは空を許さない）
  - name: shareAmount
    entity: expense
    expression: amount / max(1, headcount)
    type: number

  # メンバーごと（entity をまたぐ集計。M1.2）。`this` はこのメンバーのレコードの ID である
  # 払った合計。`payer` がこのメンバーを指す支出の `amount` を足す
  - name: paid
    entity: member
    aggregate:
      sum: expense.amount
      where:
        payer: this
    type: number
  # 負担する合計。`participants` がこのメンバーを含む支出の `shareAmount` を足す
  - name: owed
    entity: member
    aggregate:
      sum: expense.shareAmount
      where:
        participants:
          contains: this
    type: number
  # 差し引き（プラスなら受け取る）。集計を参照する式である
  - name: balance
    entity: member
    expression: paid - owed
    type: number

  # 精算（M1.2）。メンバーの差し引きから、送金の組（誰が誰へいくら）を出す。
  # **余りの負担はここでは宣言しない**（Q18-5）——`owed` は基準額の集計のままであり、
  # 1 円未満を切り捨てた余りを誰が持つかは、店頭の内部規約（Q13）が決める。
  # `amount` は支出の額なので、**整数円**でなければならない（Q18-6）。
  - name: settlement
    entity: member
    settle:
      expense: expense
      amount: amount
      payer: payer
      shares: participants

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
