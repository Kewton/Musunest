# 見本「サークルの活動」（M1.4。community.app-spec/v0.2-draft）
#
# 練習や試合を記録すると、**アプリ全体で 1 つ**の値（**今月の**活動の回数・参加ののべ人数・1 回あたりの参加・
# 費用の平均）が出る。M1.4 の各 Issue が、自分の語彙をこの見本へ足していく（docs/parallel-development.md §7.2）。
# **#177 が骨格（`scope: app` と `avg`）を置き、#178 が期間の条件（`within: this_month`）を、
# #179 が見出しごとの集計（`groupBy` と `groups` 型）を足した。**
#
# 元は workspace/mvp/m1/02-l2-spec-examples.md §4.3（叩き台）。**いまの語彙で書けないものは落としてある**：
#   - グラフの部品（`bar`・`pie`）と順位の部品（`ranking`）は #181・#182
#   - 表示名（`label`。日本語の見出しは #176）
#
# **`within: this_month` は「今月」を日本時間で決める**（Issue #178）。時計は**評価に引数で渡す**——
# 式の評価の中で現在時刻を直接読まない（Q17。「today」と同じ扱いである）。境目は
# 「日本時間の月初 00:00:00 以上、翌月初 00:00:00 未満」で、意味は ../../docs/semantics.md「within」にある。
#
# **§4.3 の `averageAttendees` は式（`attendeesThisMonth / max(1, activitiesThisMonth)`）で書いてあるが、
# この見本では `avg`（集計）を使う。** 対象が 0 件のときの平均は `null` と決まっており（窓口の決定
# 2026-09-19）、式の `max(1, …)` は 0 を返してしまうからである（0 と「求められなかった」を区別できない）。
#
# アプリ全体の値は、一覧の応答の `scope`（計算の名前 → 値）に載る。**行ごとの値とは別の欄**である。
# **見出しごとの集計（`type: groups`。Issue #179）は、さらに別の欄 `groups`**（計算の名前 → 「見出しと値」の
# 組の並び）に載る（「scope」に混ぜない）。値が求められなければ `null` で、画面は「—」で見せる（0 と区別する）。
#
# **ダッシュボード（`type: dashboard`）は #180 が足した。** 行を並べず、アプリ全体の値（`scope: app`）を
# **数値の部品（`widgets` の `number`）**で、単位つきで並べる。**部品が指せるのは `scope: app` の計算だけ**
# である（行ごとの計算は載る場所が無い）。**`entity` を持たない**し、応答の `rows` も空の並びである
# （意味は ../../docs/semantics.md「dashboard」）。
#
# 採点のシナリオは同じディレクトリの scenario.json、
# 意味は ../../docs/semantics.md（「scope」「aggregate」「within」「sum」「count」「avg」「groupBy」「groups」
# 「computed」「dashboard」）にある。

entities:
  - name: member
    fields:
      name: string          # 名前

  - name: activity
    fields:
      kind:                 # 種類（練習・試合・飲み会）
        type: enum
        options:
          practice: 練習
          match: 試合
          party: 飲み会
      date: date            # 活動した日（M1.4。`within: this_month` で「今月」に絞る）
      attendees:            # 参加した人（member のレコードの並びを ID で指す）
        type: list
        of: member
      cost: number          # 費用（円）

computed:
  # 活動 1 件ごと。参加した人の数である
  - name: attendeeCount
    entity: activity
    expression: len(attendees)
    type: number

  # アプリ全体（どのレコードにも属さない集計。M1.4 の `scope: app`）。**今月の**回数・のべ人数・平均を出す。
  # `where` の `date: { within: this_month }` は、日本時間の今月で絞る（Issue #178）。**比べる相手が
  # 期間の名前なので、出力先のレコード（`this`）を持たないアプリ全体の集計でも書ける**
  - name: activityCount
    scope: app
    aggregate:
      count: activity
      where:
        date:
          within: this_month
    type: number
  # 今月ののべ人数。**対象が計算でもよい**——参加した人の数を足す（`scope: app` の `sum`）
  - name: attendeeTotal
    scope: app
    aggregate:
      sum: activity.attendeeCount
      where:
        date:
          within: this_month
    type: number
  # 今月の 1 回あたりの参加（`avg`）。**値の無い行は数えない**。今月の活動が 0 件なら `null` である
  - name: averageAttendees
    scope: app
    aggregate:
      avg: activity.attendeeCount
      where:
        date:
          within: this_month
    type: number
  # 今月の費用の平均（`avg`）。同上
  - name: averageCost
    scope: app
    aggregate:
      avg: activity.cost
      where:
        date:
          within: this_month
    type: number

  # 見出しごとの集計（`type: groups`。M1.4。Issue #179）。**「見出しと値」の組の並び**を返す。
  # `scope` も `entity` も持たない——どのレコードにも属さず、1 つの数でもないからである。
  # 値は一覧の応答の `groups`（計算の名前 → 組の並び）に載る。**`scope` の欄には混ぜない。**
  #
  # 月で分けるものは**古い順**（左から右へ時間が進む。棒グラフの読み方に合わせる）で、
  # **直近 `last` か月**である（`last` を省いたときの既定は 6。窓口の決定 2026-09-19）。
  # データの無い月も見出しとして出し、0 と数える（軸を揃えるためである）。
  - name: activitiesByMonth
    aggregate:
      count: activity
      groupBy:
        month: activity.date
      last: 6
    type: groups
  # `enum` で分けるものは **`options` に書いた順**である（M1.3 のボードの列と揃える）。
  # 値が 0 の見出しも出す（列を消さない。`last` は書かない——見出しは `options` のキーの全部である）。
  - name: activitiesByKind
    aggregate:
      count: activity
      groupBy: activity.kind
    type: groups

views:
  # ダッシュボード（M1.4。Issue #180）。**行を並べない**——アプリ全体の集計（`scope: app`）の値を、
  # 単位つきで並べる。**`entity` は書かない**（書けば SHAPE_KEY_UNKNOWN）。部品が指す `value` は
  # アプリ全体の計算でなければならない（行ごとの計算を指せば UI_DASHBOARD_VALUE_NOT_APP_SCOPE）。
  # 部品が読む値は、一覧の応答の `scope`（計算の名前 → 値）に 1 回で載る。
  - name: dashboard
    type: dashboard
    widgets:
      - type: number
        label: 今月の活動
        value: activityCount
        unit: 回
      - type: number
        label: 今月の参加（のべ）
        value: attendeeTotal
        unit: 人
      - type: number
        label: 1 回あたりの参加
        value: averageAttendees
        unit: 人
      - type: number
        label: 今月の費用の平均
        value: averageCost
        unit: 円
  # 活動の一覧。アプリ全体の値も、一覧の上に出る（`scope` の欄）
  - name: activities
    type: list
    entity: activity
    show: [kind, attendees, cost, attendeeCount]

actions:
  - name: addMember
    entity: member
    kind: create
  - name: addActivity
    entity: activity
    kind: create

validations: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
