# 見本「サークルの活動」（M1.4。community.app-spec/v0.2）
#
# 練習や試合を記録すると、**アプリ全体で 1 つ**の値（**今月の**活動の回数・参加ののべ人数・1 回あたりの参加・
# 費用の平均）が出る。M1.4 の各 Issue が、自分の語彙をこの見本へ足していく（docs/parallel-development.md §7.2）。
# **#177 が骨格（`scope: app` と `avg`）を置き、#178 が期間の条件（`within: this_month`）を、
# #179 が見出しごとの集計（`groupBy` と `groups` 型）を、#181 がグラフの部品（`bar`・`pie`）を、
# #182 が順位の部品（`ranking`）を足した。**
#
# 元は workspace/mvp/m1/02-l2-spec-examples.md §4.3（叩き台）。**グラフの部品（`bar`・`pie`）は #181 が、
# 順位の部品（`ranking`）は #182 が足した**ので、§4.3 の部品はすべてこの見本で書けている。
# （表示名（`label`）は #176 が足した）
#
# **`within: this_month` は「今月」を日本時間で決める**（Issue #178）。時計は**評価に引数で渡す**——
# 式の評価の中で現在時刻を直接読まない（Q17。「today」と同じ扱いである）。境目は
# 「日本時間の月初 00:00:00 以上、翌月初 00:00:00 未満」で、意味は ../../docs/semantics.md「within」にある。
#
# **§4.3 の `averageAttendees` は式（`attendeesThisMonth / max(1, activitiesThisMonth)`）で書いてあるが、
# この見本では `avg`（集計）を使う。** 対象が 0 件のときの平均は `null` と決まっており（窓口の決定
# 2026-09-19）、式の `max(1, …)` は 0 を返してしまうからである（0 と「求められなかった」を区別できない）。
#
# アプリ全体の値は、一覧の応答の `scope`（計算の名前 → 値）に載る。**行ごとの値とは別の欄**である。
# **見出しごとの集計（`type: groups`。Issue #179）は、さらに別の欄 `groups`**（計算の名前 → 「見出しと値」の
# 組の並び）に載る（「scope」に混ぜない）。値が求められなければ `null` で、画面は「—」で見せる（0 と区別する）。
#
# **ダッシュボード（`type: dashboard`）は #180 が足した。** 行を並べず、アプリ全体の値（`scope: app`）を
# **数値の部品（`widgets` の `number`）**で、単位つきで並べる。**部品が指せるのは `scope: app` の計算だけ**
# である（行ごとの計算は載る場所が無い）。**`entity` を持たない**し、応答の `rows` も空の並びである
# （意味は ../../docs/semantics.md「dashboard」）。
#
# **棒（`bar`）と円（`pie`）の部品は #181 が足した。** 見出しごとの集計（`type: groups`）の「見出しと値の
# 組の並び」を描く。**指せるのは `type: groups` の計算だけ**である（数値の部品が `scope: app` を指すのと
# 対である）。値は応答の `groups` に 1 回で載る。**画面は式も集計も評価しない**。
#
# **順位の部品（`widgets` の `ranking`）は #182 が足した。** ダッシュボードで**初めて行を並べる**部品で、
# `activity` の行を**行ごとの数の計算**の降順に並べる（同数は登録した順で安定させる）。**基準にアプリ全体の
# 集計は指せない**（行ごとの値が無い）。値は応答の**兄弟の欄 `ranking`**（部品の `name` → 行の並び）に載る
# （意味は ../../docs/semantics.md「ranking」）。
#
# **メンバーの一覧（`type: list`・`entity: member`）は #200 が足した。** 画面は**参照の候補を、参照先を
# 一覧にする view の行**から読む（意味は ../../docs/semantics.md「参照」）。この一覧が無かったのは
# **語彙の不足ではなく、見本の書き漏れ**だった——#183 はダッシュボードと活動の一覧だけを置いたので、
# #184 のデモで活動の参加者の欄が「選べる候補がありません。先に登録してください。」になり、活動を 1 件も
# 入力できなかった。#200 は一覧を足し、`member` の操作（`addMember`・`deleteMember`）の対象も画面から見える
# ようにした（**先頭の view は `dashboard` のまま**である）。
#
# ── いまの語彙で書けなかったこと（§4.3 との違い。Issue #183） ─────────────────────
#
# この見本の元は workspace/mvp/m1/02-l2-spec-examples.md §4.3（2026-09-15 の叩き台）である。
# §4.3 が使おうとした書き方のうち、**いまの語彙では書けないもの**は次のとおり。**この表は消さない**——
# 語彙を足すかどうかの材料である（04-spec-evolution.md §6.1「見本が必要としていて、今の語彙では書けない
# ときだけ足す」）。task-board の見本（samples/task-board/app.spec.yaml）と同じやり方で残す。
#
#   §4.3 の書き方                                  いまの語彙について                        どうしたか
#   `app: { name: サークルの活動 }`                 トップレベルは 7 欄で固定（`app` が無い）  落とした
#   entity の `label:`（メンバー・活動）            `label` は項目と計算にだけ付けられる       落とした
#   `required: true`                                いまは全項目が必須（書く欄が無い）        落とした
#   `cost == null or cost >= 0`（検査の式）         式に `null` も `or` も無い                validations を空にした
#   `sort: { by: date, order: desc }`（活動の一覧） 行は登録した順                            落とした
#   `averageAttendees` を式で書く                   アプリ全体の値を式では書けない            集計の `avg` に置き換えた
#   `ranking` を member の `attendance` で並べる     基準に指せるのは行ごとの計算だけ（#182）  activity の `attendeeCount` にした
#
# 意味のうち表現できない点は、上のように**いまの形へ落としてある**（落としたことを隠さない）。
#
# 採点のシナリオは同じディレクトリの scenario.json、
# 意味は ../../docs/semantics.md（「scope」「aggregate」「within」「sum」「count」「avg」「groupBy」「groups」
# 「computed」「dashboard」「bar」「pie」「ranking」）にある。

entities:
  - name: member
    fields:
      name:                 # 名前
        type: string
        label: 名前

  - name: activity
    fields:
      kind:                 # 種類（練習・試合・飲み会）
        type: enum
        label: 種類
        options:
          practice: 練習
          match: 試合
          party: 飲み会
      date:                 # 活動した日（M1.4。`within: this_month` で「今月」に絞る）
        type: date
        label: 日付
      attendees:            # 参加した人（member のレコードの並びを ID で指す）
        type: list
        of: member
        label: 参加した人
      cost:                 # 費用（円）
        type: number
        label: 費用

computed:
  # 活動 1 件ごと。参加した人の数である
  - name: attendeeCount
    entity: activity
    expression: len(attendees)
    type: number
    label: 参加人数

  # アプリ全体（どのレコードにも属さない集計。M1.4 の `scope: app`）。**今月の**回数・のべ人数・平均を出す。
  # `where` の `date: { within: this_month }` は、日本時間の今月で絞る（Issue #178）。**比べる相手が
  # 期間の名前なので、出力先のレコード（`this`）を持たないアプリ全体の集計でも書ける**
  - name: activityCount
    scope: app
    aggregate:
      count: activity
      where:
        date:
          within: this_month
    type: number
  # 今月ののべ人数。**対象が計算でもよい**——参加した人の数を足す（`scope: app` の `sum`）
  - name: attendeeTotal
    scope: app
    aggregate:
      sum: activity.attendeeCount
      where:
        date:
          within: this_month
    type: number
  # 今月の 1 回あたりの参加（`avg`）。**値の無い行は数えない**。今月の活動が 0 件なら `null` である
  - name: averageAttendees
    scope: app
    aggregate:
      avg: activity.attendeeCount
      where:
        date:
          within: this_month
    type: number
  # 今月の費用の平均（`avg`）。同上
  - name: averageCost
    scope: app
    aggregate:
      avg: activity.cost
      where:
        date:
          within: this_month
    type: number

  # 見出しごとの集計（`type: groups`。M1.4。Issue #179）。**「見出しと値」の組の並び**を返す。
  # `scope` も `entity` も持たない——どのレコードにも属さず、1 つの数でもないからである。
  # 値は一覧の応答の `groups`（計算の名前 → 組の並び）に載る。**`scope` の欄には混ぜない。**
  #
  # 月で分けるものは**古い順**（左から右へ時間が進む。棒グラフの読み方に合わせる）で、
  # **直近 `last` か月**である（`last` を省いたときの既定は 6。窓口の決定 2026-09-19）。
  # データの無い月も見出しとして出し、0 と数える（軸を揃えるためである）。
  - name: activitiesByMonth
    aggregate:
      count: activity
      groupBy:
        month: activity.date
      last: 6
    type: groups
  # `enum` で分けるものは **`options` に書いた順**である（M1.3 のボードの列と揃える）。
  # 値が 0 の見出しも出す（列を消さない。`last` は書かない——見出しは `options` のキーの全部である）。
  - name: activitiesByKind
    aggregate:
      count: activity
      groupBy: activity.kind
    type: groups

views:
  # ダッシュボード（M1.4。Issue #180）。**行を並べない**——アプリ全体の集計（`scope: app`）の値を、
  # 単位つきで並べる。**`entity` は書かない**（書けば SHAPE_KEY_UNKNOWN）。部品が指す `value` は
  # アプリ全体の計算でなければならない（行ごとの計算を指せば UI_DASHBOARD_VALUE_NOT_APP_SCOPE）。
  # 部品が読む値は、一覧の応答の `scope`（計算の名前 → 値）に 1 回で載る。
  - name: dashboard
    type: dashboard
    widgets:
      - type: number
        label: 今月の活動
        value: activityCount
        unit: 回
      - type: number
        label: 今月の参加（のべ）
        value: attendeeTotal
        unit: 人
      - type: number
        label: 1 回あたりの参加
        value: averageAttendees
        unit: 人
      - type: number
        label: 今月の費用の平均
        value: averageCost
        unit: 円
      # 棒（`bar`）と円（`pie`）の部品（M1.4。Issue #181）。**指せるのは見出しごとの集計（`type: groups`）
      # の計算だけ**である（指せなければ UI_DASHBOARD_VALUE_NOT_GROUPS）。値は一覧の応答の `groups`
      # （計算の名前 → 「見出しと値」の組の並び）に 1 回で載る。`enum` の見出しは宣言の `options` の
      # 表示名に写して出す（送られてくるのはキーである）。円は**割合（%）も数字で出す**。
      - type: bar
        label: 月ごとの活動回数
        value: activitiesByMonth
        unit: 回
      - type: pie
        label: 種類の内訳
        value: activitiesByKind
        unit: 回
      # 順位の部品（`type: ranking`。M1.4。Issue #182）。**行を並べる唯一の部品**である——`activity` の行を、
      # 行ごとの数の計算（`by`）の降順に並べる。**基準にアプリ全体の集計は指せない**ので、`by` は行ごとの
      # 計算 `attendeeCount` である。`by` は `show` に含める（出す項目の 1 つとして基準を見せる）。
      # `limit` は省いてある——**既定の 5 が効く**（窓口の決定 2026-09-19）。`name` は鍵である。
      - type: ranking
        name: topActivities
        label: 参加の多い活動
        entity: activity
        by: attendeeCount
        show: [date, kind, attendeeCount]
  # 活動の一覧。アプリ全体の値も、一覧の上に出る（`scope` の欄）
  - name: activities
    type: list
    entity: activity
    show: [kind, attendees, cost, attendeeCount]
  # メンバーの一覧（M1.4。Issue #200）。**参照の候補を一覧にする view** である——画面は参照
  # （`attendees: {type: list, of: member}`）の候補を、**参照先（`member`）を一覧にする view の行**から読む
  # （意味は ../../docs/semantics.md「参照」）。これが無いと、参加者の欄が「選べる候補がありません」になり、
  # 画面だけで活動を 1 件も入力できない。`member` の操作（`addMember`・`deleteMember`）の対象も、この一覧で
  # 見える。**先頭の view は `dashboard` のまま**である。置き場所は `activities` の後ろ（窓口の決定 2026-09-23）。
  - name: members
    type: list
    entity: member
    show: [name]

actions:
  - name: addMember
    entity: member
    kind: create
  - name: addActivity
    entity: activity
    kind: create
  # 消す（M1.2 の `delete`。§4.3 にもある）。**staging の e2e（Issue #183）が、固定 ID の e2e 用
  # インスタンスを毎回作り直さずに済むよう、専用データを片付けるのに使う**——活動は見出しごとの集計と
  # 順位に効くので、実行のたびに増やさない（片付けは活動 → メンバーの順。参照されているメンバーは消せない）
  - name: deleteActivity
    entity: activity
    kind: delete
  # §4.3 には無いが、e2e が自分で足したメンバーを片付けるために足した（warikan の `deleteMember` と同じ）
  - name: deleteMember
    entity: member
    kind: delete

validations: []

permissions:
  - name: read
    subject: minIdentity
  - name: write
    subject: minIdentity

minIdentity:
  mode: anonymous
