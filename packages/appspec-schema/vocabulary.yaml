  check_rules: [DATA_ENTITY_DUPLICATE_NAME, SHAPE_NAME_INVALID, SHAPE_KEY_MISSING, DATA_FIELD_NAME_RESERVED, DATA_FIELD_TYPE_UNKNOWN]
  semantics: docs/semantics.md#entity
  runtime: [spec-engine, data-api, app-do, host]
  factory: 未対応

