# 語彙の台帳（workspace/mvp/m1/04-spec-evolution.md §6.2）
#
# 1 行に 1 つの語彙を置き、語彙が「一周」を置き去りにしていないかを機械で確かめる。
# **欄が 1 つでも欠けた行があれば、unit テスト（src/index.test.ts）で落ちる。**
# この台帳は、工場（CommandAgent）へ渡す「この版で使える語彙の一覧」にもなる。
#
#   name         語彙の名前。src/spec.ts の VOCABULARY と 1 対 1 に対応する
#   layer        層（integration / data / logic / permission / ui / ux）
#   since        入った版とマイルストーン
#   samples      使っている見本（samples/<name>/）
#   negatives    落ちることを確かめる負例（samples/negatives/<name>.app.spec.yaml）
#   check_rules  静的チェックの誤りコード。この行の負例が出すコードと、ちょうど同じ集まりにする
#   semantics    意味の文書の節（docs/semantics.md の「### <節>」）
#   runtime      動かす場所（packages/ か apps/ の下のパッケージ）。M1.1 の各 Issue で実装する
#   factory      工場が扱えるか。草案の間は「未対応」（M1.6 で工場が対応したら埋める）
#
# 書き方は src/ledger-yaml.ts が読める形に限る（「- 欄: 値」と、2 文字下げた「欄: 値」。並びは 1 行の [a, b]）。
# 誤りコードは草案で、体系は spec-engine の静的チェック（#97）で確定する。

# ── データ層 ─────────────────────────────────────────────────────

- name: entity
  layer: data
  since: v0.2-draft（M1.1）
  samples: [expense-log, warikan]
