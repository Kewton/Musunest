# ダッシュボード（dashboard）。**行を並べず、計算した値そのものを部品で並べる**画面の種類である（M1.4。Issue #180）。
# 見本は dashboard。**数値の部品（`widgets` の `number`）と単位（`unit`）も、この行がまとめて扱う**——
# `board` が `columns`・`highlight` を台帳に行を分けずに扱っているのと同じである（1 語 1 行の原則。
# 部品の種類 `number` は、データ層の項目の型 `number` と同じ語でもある）。
- name: dashboard
  layer: ui
  since: v0.2-draft（M1.4）
  samples: [dashboard]
  negatives: [dashboard-no-parts, dashboard-number-not-app-scope]
  check_rules: [SHAPE_KEY_MISSING, UI_DASHBOARD_VALUE_NOT_APP_SCOPE]
  semantics: docs/semantics.md#dashboard
  runtime: [spec-engine, data-api, host]
  factory: 未対応

# 表示名（label）。**画面に出すためだけ**の語彙である（M1.3。Issue #176）。
# 付けられるのは**項目（fields）と計算（computed）だけ**で、**無ければ識別子をそのまま出す**。
# 式からは読めない（式が読むのは識別子だけである）。**保存される値は変わらない**。
# 「見本」は task-board と warikan である（**両方とも、識別子のまま出る例を 1 つ残してある**——
# task-board の `due`、warikan の `member.name`）。
- name: label
  layer: ui
  since: v0.2-draft（M1.3）
  samples: [task-board, warikan]
  negatives: [label-empty, label-not-string]
  check_rules: [SHAPE_LABEL_EMPTY, SHAPE_LABEL_INVALID]
  semantics: docs/semantics.md#label
  runtime: [spec-engine, data-api, host]
  factory: 未対応

# 絞り込み（filters）。**画面が選んで絞り込む** UX 層の語彙である（M1.3。`03` §1・`04` §7.1）。
#
# **画面の種類 `list` は、この台帳に行を分けていない。** `list` はデータ層の項目の型（文字列の並び）と
# **同じ語**で、台帳は 1 行 1 語彙だからである——画面の種類の側は `view` の意味の節
# （docs/semantics.md#view）で扱う。
#
# 「見本」も task-board である（#159 が置いた）。
- name: filters
  layer: ux
  since: v0.2-draft（M1.3）
  samples: [task-board]
  negatives: [filters-unsupported-field, filters-field-not-shown]
  check_rules: [UI_FILTER_FIELD_NOT_FILTERABLE, UI_FILTER_FIELD_NOT_SHOWN]
  semantics: docs/semantics.md#filters
  runtime: [spec-engine, host]
  factory: 未対応

